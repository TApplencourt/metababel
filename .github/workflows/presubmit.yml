name: Presubmit
on:
  push:
  pull_request:
  schedule:
    # At 00:00 on Sunday
    - cron: "0 0 * * 0"

jobs:
  build-and-check:
    strategy:
      matrix:
        compiler: [gcc, clang, g++]
        build_gem: [true, false]
        ruby: [ruby3.3]
    name: 'Check: ${{matrix.compiler}}, ${{matrix.ruby}}, build_gem? ${{matrix.build_gem}}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo add-apt-repository ppa:lttng/ppa
          sudo apt-get update
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: ${{matrix.compiler}} ${{matrix.ruby}} babeltrace2 libbabeltrace2-dev valgrind libc6-dbg
          version: 1.0
      - name: Install Gem
        run: |
          gem build metababel
          sudo gem install metababel
          echo "METABABEL_INSTALL=1" >> $GITHUB_ENV
        if: ${{ matrix.build_gem == true }}
      - name: Run tests
        run: CC=${{matrix.compiler}} CFLAGS="-Wall -Werror" rake test
      - name: Run tests with Valgrind
        env:
          METABABEL_VALGRIND: 1
        run: CC=${{matrix.compiler}} CFLAGS="-Wall -Werror" rake test
        if: ${{ matrix.build_gem == false }}
  babeltrace2-master:
    # Same tests against babeltrace2 built from upstream master, to catch
    # regressions early and to run the CTF round trips that are skipped
    # because of bugs only fixed there (see CTF_ROUNDTRIP_BUG_* in test/base_test.rb)
    name: 'Check: gcc, ruby3.3, babeltrace2 master'
    runs-on: ubuntu-latest
    env:
      # Bugs fixed upstream but not in the babeltrace2 of the other jobs: don't ask to remove their workaround
      METABABEL_BT2_UPSTREAM: 1
    steps:
      - uses: actions/checkout@v6
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: gcc g++ ruby3.3 autoconf automake libtool pkg-config libglib2.0-dev libfmt-dev flex bison valgrind libc6-dbg
          version: 1.0
      - name: Build babeltrace2 master
        run: |
          git clone --depth 1 https://github.com/efficios/babeltrace /tmp/babeltrace
          cd /tmp/babeltrace
          git log -1 --format='babeltrace master: %H %cd'
          ./bootstrap
          # Use the system {fmt} (libfmt-dev). babeltrace2 requires fmt >= 10.1.1, but
          # {fmt} 10.1.1 (Ubuntu 25.04 to 26.10) reports itself as 10.1.0 (FMT_VERSION
          # wasn't bumped upstream). Setting FMT_CFLAGS/FMT_LIBS skips that pkg-config
          # version check (FMT_CFLAGS must be non-empty, hence the space).
          ./configure --prefix=/usr/local --disable-man-pages --disable-debug-info \
            --disable-python-bindings --disable-python-plugins --disable-tests \
            FMT_CFLAGS=" " FMT_LIBS="$(pkg-config --libs fmt)"
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          babeltrace2 --version
      - name: Run tests
        run: CC=gcc CFLAGS="-Wall -Werror" rake test
      - name: Run tests with Valgrind
        env:
          METABABEL_VALGRIND: 1
        run: CC=gcc CFLAGS="-Wall -Werror" rake test
  example:
    runs-on: ubuntu-latest
    name: Check with example
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo add-apt-repository ppa:lttng/ppa
          sudo apt-get update
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: ${{matrix.compiler}} ${{matrix.ruby}} babeltrace2 libbabeltrace2-dev
          version: 1.0
      - run: |
          cd example
          ./run.sh
